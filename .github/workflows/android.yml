name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # app/google-services.json no se sube al repo: se guarda en el secreto GOOGLE_SERVICES_JSON.
      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Falta el secreto GOOGLE_SERVICES_JSON" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # Clave de firma fija (secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD). Sin ella, cada
      # compilación usa una clave distinta y el inicio de sesión con Google no funciona.
      - name: Restaurar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > iris-release.p12
            printf 'storeFile=iris-release.p12\nstorePassword=%s\nkeyAlias=iris\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
            echo "Clave de firma fija configurada."
          else
            echo "::warning::Sin clave de firma fija: el inicio de sesión con Google no funcionará en este APK."
          fi

      - name: Tests unitarios
        run: ./gradlew :app:testDevDebugUnitTest --stacktrace

      - name: Compilar APK (dev debug)
        run: ./gradlew :app:assembleDevDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: iris-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 14
