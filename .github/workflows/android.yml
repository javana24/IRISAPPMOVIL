name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # app/google-services.json no se sube al repo: se guarda en el secreto GOOGLE_SERVICES_JSON.
      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Falta el secreto GOOGLE_SERVICES_JSON" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Tests unitarios
        run: ./gradlew :app:testDevDebugUnitTest --stacktrace

      - name: Compilar APK (dev debug)
        run: ./gradlew :app:assembleDevDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: iris-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 14
